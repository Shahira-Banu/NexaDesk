
spring.application.name=nexadesk-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/nexadesk_db
spring.datasource.username=nexadesk_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.admin-setup.key=${ADMIN_SETUP_KEY:}
